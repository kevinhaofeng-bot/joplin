[Service]
# Additive drop-in; base service and legacy tls directory remain rollback paths.
ExecStart=
ExecStart=/usr/bin/docker --host=unix:///run/joplin-lite-docker.sock run --rm --name joplin-lite-sync --network host --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 128m --memory-swap 128m --cpus 2 --tmpfs /tmp:rw,noexec,nosuid,size=8m --env-file /volume1/Projects/joplin-lite-runtime/secrets/server.env --mount type=bind,src=/volume1/Projects/joplin-lite-runtime/data,dst=/data --mount type=bind,src=/volume1/Projects/joplin-lite-runtime/tls-managed/current,dst=/tls,readonly sha256:ec77ac4d7ba0dfbaf62389d11feb9d23f241d31f2f620ebda73b3086d335a5d8
