[package]
name = "joplin-lite"
version = "0.1.0"
edition = "2024"

[lib]
name = "joplin_lite"
path = "src/lib.rs"

[dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.1", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
libc = "0.2"
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
