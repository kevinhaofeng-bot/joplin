[package]
name = "app-lite-protocol"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Blocking HTTP transport for the sync client (docs/research/sync-client-design-v1.md §1).
client = ["dep:ureq", "dep:flate2", "dep:rustls", "dep:rustls-pemfile", "dep:webpki-roots"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls", "gzip"], optional = true }
flate2 = { version = "1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-pemfile = { version = "2", optional = true }
webpki-roots = { version = "0.26", optional = true }
