[package]
name = "app-lite-protocol"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Blocking HTTP transport for the sync client (docs/research/sync-client-design-v1.md §1).
client = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json"], optional = true }
