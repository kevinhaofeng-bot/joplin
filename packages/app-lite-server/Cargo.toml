[package]
name = "app-lite-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
app-lite-protocol = { path = "../app-lite-protocol" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"

[dev-dependencies]
rcgen = "0.13"
app-lite-protocol = { path = "../app-lite-protocol", features = ["client"] }
tempfile = "3"
