[package]
name = "app-lite-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
app-lite-protocol = { path = "../app-lite-protocol" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tiny_http = "0.12"

[dev-dependencies]
app-lite-protocol = { path = "../app-lite-protocol", features = ["client"] }
tempfile = "3"
